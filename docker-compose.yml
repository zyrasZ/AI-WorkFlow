version: '3.9'

services:
  backend:
    build:
      context: ./back_end_Auto_Office
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - ./back_end_Auto_Office/.env.example
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - '4173:80'
    depends_on:
      - backend
    restart: unless-stopped
